name: vm-integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # KST 03:00 (nightly)

permissions:
  contents: read

jobs:
  vm-integration:
    name: VM integration test
    runs-on: [self-hosted, bori-vm]
    environment: bori-vm-integration

    steps:
      - uses: actions/checkout@v7

      # kube-slint provides the slint-gate CLI that `bori verify` runs on the VM.
      # actions/checkout rejects paths outside the workspace, so it is cloned to
      # an in-workspace path and KUBE_SLINT_DIR (below) points at it.
      # Pinned to the same immutable commit bori's go.mod selects (703c494c,
      # KSL-E2P selector aggregation) so the gate matches the producer, not a
      # moving default branch.
      - uses: actions/checkout@v7
        with:
          repository: HeaInSeo/kube-slint
          ref: 703c494ccb84cd0c480a45585665c47a5ff03a95
          path: kube-slint

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run VM integration test
        run: hack/test-vm-integration.sh
        env:
          # BORI_VM_REMOTE: SSH target for the remote VM.
          # Configure as a repository variable: Settings → Variables → BORI_VM_REMOTE.
          BORI_VM_REMOTE: ${{ vars.BORI_VM_REMOTE }}
          KUBE_SLINT_DIR: ${{ github.workspace }}/kube-slint

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-integration-artifacts-${{ github.run_id }}
          path: artifacts/vm/**
          if-no-files-found: warn
