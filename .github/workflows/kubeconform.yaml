name: kubeconform

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/kubeconform.yaml"
  pull_request:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/kubeconform.yaml"

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  validate:
    name: Validate Kubernetes schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate manifests
        run: |
          find config/ -name '*.yaml' -print0 | xargs -0 kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.0 \
            -skip CustomResourceDefinition
