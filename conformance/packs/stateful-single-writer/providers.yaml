http: {allowInsecureHTTP: true, allowPrivateNetworks: true}
providers:
  - namespace: conf-sw
    name: kube-status
    configRevision: r1
    kubernetesStatus: {fields: {ready-replicas: readyReplicas}}
  - namespace: conf-sw
    name: db-http
    configRevision: r1
    http:
      endpoints:
        - {subjectUID: w-db, url: "${EVIDENCE_URL}/db", fields: {active-writers: writers, role: role}}
