apiVersion: v1
kind: Service
metadata:
  name: nodesentinel
  namespace: nodesentinel-system
  labels:
    app.kubernetes.io/name: nodesentinel
spec:
  selector:
    app.kubernetes.io/name: nodesentinel
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
