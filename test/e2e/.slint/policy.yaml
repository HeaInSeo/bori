# kube-slint gate policy for the bori-operator VM target.
#
# Every ID below must match an intent of the compile-time bori-operator profile
# (cmd/bori/sliprofile.go). cmd/bori/policy_test.go evaluates this file with the
# kube-slint gate against a summary produced by that profile.
#
# Phase: summary-only. The VM run invokes the gate with `--fail-on NEVER`, so a
# gate grade is recorded in the run archive but never fails CI. Hard-fail
# thresholds and Protected Qualification need a separate central decision.
#
# - reconcile-delta >= 1 carries over the legacy rule "warn if no reconcile
#   happened". threshold_miss is not promoted, so a miss grades WARN, never FAIL.
# - The other three intents are listed as informational: measured and covered,
#   but not graded.
# - coverage_gap is promoted: a measured SLI that this policy does not name
#   (for example a renamed intent) grades FAIL instead of passing unnoticed.
schema_version: "slint.policy.v2"

thresholds:
  - name: "reconcile-delta-min"
    metric: "reconcile-delta"
    operator: ">="
    value: 1

regression:
  enabled: false

reliability:
  required: false

coverage:
  required: true
  informational:
    - "reconcile-errors-delta"
    - "workqueue-depth-end"
    - "rest-errors-delta"

promote_to_fail:
  - "coverage_gap"
